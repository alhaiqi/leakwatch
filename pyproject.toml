[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakwatch"
version = "0.1.0"
description = "Personal secret-leak watcher for GitHub pushes, running on a Fly.io Sprite"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "starlette>=0.37", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
leakwatch = "leakwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
